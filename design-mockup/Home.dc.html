<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: 'Public Sans', system-ui, sans-serif; }
    a { color: oklch(52% 0.16 254); }
    a:hover { color: oklch(38% 0.14 254); }
    .num { font-family: 'Manrope', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .btn { border: none; cursor: pointer; font-family: 'Public Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; border-radius: 32px; overflow: hidden; background: oklch(98% 0.005 254); box-shadow: 0 24px 60px -20px oklch(22% 0.02 254 / 0.35); display: flex; flex-direction: column; position: relative;">

  <div style="height: 40px; flex-shrink: 0;"></div>

  <div style="padding: 0 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 999px; background: oklch(94% 0.03 254); display: flex; align-items: center; justify-content: center; font-family: 'Manrope', system-ui, sans-serif; font-weight: 700; color: oklch(52% 0.16 254); font-size: 15px;">CS</div>
      <div>
        <div style="font-size: 13px; color: oklch(45% 0.02 254);">Good afternoon</div>
        <div style="font-size: 16px; font-weight: 700; color: oklch(22% 0.02 254); font-family: 'Manrope', system-ui, sans-serif;">Sopheak Chan</div>
      </div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 999px; background: oklch(100% 0 0); border: 1px solid oklch(90% 0.012 254); display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="oklch(45% 0.02 254)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    </div>
  </div>

  <div style="padding: 20px 24px 0; flex: 1; overflow: hidden;">

    <div style="border-radius: 22px; padding: 24px; background: linear-gradient(135deg, oklch(52% 0.16 254), oklch(38% 0.14 254)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 16px 32px -14px oklch(52% 0.16 254 / 0.55);">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(100% 0 0 / 0.75);">Your Financial Power</span>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span class="num" style="font-size: 46px; font-weight: 800; color: oklch(100% 0 0); line-height: 1;">$250</span>
        <span style="font-size: 15px; font-weight: 600; color: oklch(100% 0 0 / 0.8);">/ month</span>
      </div>
      <span style="font-size: 13px; line-height: 1.5; color: oklch(100% 0 0 / 0.85); max-width: 280px;">Available capacity for a new Personal Loan or Credit Card, based on your income and current obligations.</span>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px;">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="oklch(100% 0 0 / 0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span style="font-size: 11.5px; color: oklch(100% 0 0 / 0.7);">Updated today</span>
      </div>
    </div>

    <div style="border-radius: 16px; background: oklch(100% 0 0); border: 1px solid oklch(90% 0.012 254); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; margin-top: 20px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 34px; height: 34px; border-radius: 999px; background: oklch(94% 0.03 254); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="oklch(52% 0.16 254)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5"/><path d="M12 8h.01"/></svg>
        </div>
        <span style="font-size: 14px; font-weight: 700; color: oklch(22% 0.02 254); font-family: 'Manrope', system-ui, sans-serif;">How this is calculated</span>
      </div>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="oklch(60% 0.02 254)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div style="padding: 16px 24px 16px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
    <button type="button" class="btn" style="height: 52px; border-radius: 14px; background: oklch(52% 0.16 254); color: oklch(100% 0 0); font-size: 15px; font-weight: 700;">Apply for Personal Loan</button>
    <button type="button" class="btn" style="height: 52px; border-radius: 14px; background: oklch(100% 0 0); border: 1.5px solid oklch(52% 0.16 254); color: oklch(52% 0.16 254); font-size: 15px; font-weight: 700;">Apply for Credit Card</button>
  </div>

  <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid oklch(90% 0.012 254); background: oklch(100% 0 0); padding: 10px 0 14px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="oklch(52% 0.16 254)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span style="font-size: 10.5px; font-weight: 700; color: oklch(52% 0.16 254);">Home</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="oklch(60% 0.02 254)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      <span style="font-size: 10.5px; color: oklch(60% 0.02 254);">Cards</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="oklch(60% 0.02 254)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span style="font-size: 10.5px; color: oklch(60% 0.02 254);">Loans</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="oklch(60% 0.02 254)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span style="font-size: 10.5px; color: oklch(60% 0.02 254);">Profile</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
