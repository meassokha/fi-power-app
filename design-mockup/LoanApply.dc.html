<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: 'Public Sans', system-ui, sans-serif; }
    a { color: oklch(52% 0.16 254); }
    a:hover { color: oklch(38% 0.14 254); }
    .num { font-family: 'Manrope', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .btn { border: none; cursor: pointer; font-family: 'Public Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; border-radius: 32px; overflow: hidden; background: oklch(98% 0.005 254); box-shadow: 0 24px 60px -20px oklch(22% 0.02 254 / 0.35); display: flex; flex-direction: column; position: relative;">

  <div style="height: 40px; flex-shrink: 0;"></div>

  <div style="padding: 0 24px 16px; display: flex; align-items: center; gap: 14px; flex-shrink: 0;">
    <div style="width: 36px; height: 36px; border-radius: 999px; background: oklch(100% 0 0); border: 1px solid oklch(90% 0.012 254); display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="oklch(22% 0.02 254)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-size: 16px; font-weight: 800; color: oklch(22% 0.02 254); font-family: 'Manrope', system-ui, sans-serif;">Personal Loan</div>
  </div>

  <div style="padding: 8px 24px 0; flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px;">

    <div style="text-align: center; padding: 8px 0 4px;">
      <div style="font-size: 12.5px; font-weight: 600; color: oklch(45% 0.02 254); margin-bottom: 6px;">Loan amount</div>
      <div class="num" style="font-size: 44px; font-weight: 800; color: oklch(22% 0.02 254); line-height: 1;">$5,000</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="position: relative; height: 6px; border-radius: 999px; background: oklch(90% 0.012 254);">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 68%; border-radius: 999px; background: oklch(52% 0.16 254);"></div>
        <div style="position: absolute; left: 68%; top: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 999px; background: oklch(100% 0 0); border: 4px solid oklch(52% 0.16 254); box-shadow: 0 2px 6px oklch(22% 0.02 254 / 0.25);"></div>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span class="num" style="font-size: 11.5px; color: oklch(60% 0.02 254);">$1,000</span>
        <span class="num" style="font-size: 11.5px; color: oklch(60% 0.02 254);">$7,100 max</span>
      </div>
      <div style="font-size: 11px; color: oklch(52% 0.16 254); text-align: center; font-weight: 600;">Capped by your Financial Power</div>
    </div>

    <div>
      <div style="font-size: 13px; font-weight: 700; color: oklch(22% 0.02 254); margin-bottom: 10px;">Repayment tenure</div>
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
        <div style="text-align: center; padding: 10px 0; border-radius: 12px; border: 1.5px solid oklch(90% 0.012 254); font-size: 13px; font-weight: 600; color: oklch(45% 0.02 254);">6 mo</div>
        <div style="text-align: center; padding: 10px 0; border-radius: 12px; border: 1.5px solid oklch(90% 0.012 254); font-size: 13px; font-weight: 600; color: oklch(45% 0.02 254);">12 mo</div>
        <div style="text-align: center; padding: 10px 0; border-radius: 12px; border: 1.5px solid oklch(90% 0.012 254); font-size: 13px; font-weight: 600; color: oklch(45% 0.02 254);">24 mo</div>
        <div style="text-align: center; padding: 10px 0; border-radius: 12px; background: oklch(52% 0.16 254); font-size: 13px; font-weight: 700; color: oklch(100% 0 0);">36 mo</div>
      </div>
    </div>

    <div style="border-radius: 16px; background: oklch(100% 0 0); border: 1px solid oklch(90% 0.012 254); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13.5px; color: oklch(45% 0.02 254);">Monthly installment</span>
        <span class="num" style="font-size: 16px; font-weight: 800; color: oklch(52% 0.16 254);">$176 / mo</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13.5px; color: oklch(45% 0.02 254);">Interest rate</span>
        <span class="num" style="font-size: 13.5px; font-weight: 600; color: oklch(22% 0.02 254);">16.0% APR</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13.5px; color: oklch(45% 0.02 254);">Total repayable</span>
        <span class="num" style="font-size: 13.5px; font-weight: 600; color: oklch(22% 0.02 254);">$6,336</span>
      </div>
      <div style="height: 1px; background: oklch(93% 0.01 254);"></div>
      <div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
          <span style="font-size: 12px; color: oklch(45% 0.02 254);">Financial Power used</span>
          <span class="num" style="font-size: 12px; font-weight: 700; color: oklch(22% 0.02 254);">$176 of $250</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: oklch(93% 0.01 254);">
          <div style="height: 100%; width: 70%; border-radius: 999px; background: oklch(58% 0.14 152);"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 14px 24px 22px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
    <button type="button" class="btn" style="width: 100%; height: 52px; border-radius: 14px; background: oklch(52% 0.16 254); color: oklch(100% 0 0); font-size: 15px; font-weight: 700;">Apply Now</button>
    <div style="text-align: center; font-size: 10.5px; color: oklch(60% 0.02 254);">Indicative only. Subject to final approval.</div>
  </div>

</div>
</x-dc>
</body>
</html>
