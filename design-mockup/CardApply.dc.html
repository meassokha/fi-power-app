<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: 'Public Sans', system-ui, sans-serif; }
    a { color: oklch(52% 0.16 254); }
    a:hover { color: oklch(38% 0.14 254); }
    .num { font-family: 'Manrope', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .btn { border: none; cursor: pointer; font-family: 'Public Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; border-radius: 32px; overflow: hidden; background: oklch(98% 0.005 254); box-shadow: 0 24px 60px -20px oklch(22% 0.02 254 / 0.35); display: flex; flex-direction: column; position: relative;">

  <div style="height: 40px; flex-shrink: 0;"></div>

      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="oklch(22% 0.02 254)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

      <div style="display: flex; align-items: center; justify-content: space-between; position: relative;">
        <span style="font-family: 'Manrope', system-ui, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.06em; color: oklch(100% 0 0);">WING</span>
        <span class="num" style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(100% 0 0 / 0.8); background: oklch(100% 0 0 / 0.15); padding: 3px 9px; border-radius: 999px;">Gold</span>
      </div>
      <div class="num" style="font-size: 18px; letter-spacing: 0.1em; color: oklch(100% 0 0 / 0.9); position: relative;">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 4821</div>
      <div style="display: flex; align-items: center; justify-content: space-between; position: relative;">
        <span style="font-size: 12px; color: oklch(100% 0 0 / 0.85); letter-spacing: 0.03em;">SOPHEAK CHAN</span>
        <span class="num" style="font-size: 12px; color: oklch(100% 0 0 / 0.75);">08/29</span>
      </div>
    </div>

    <div style="text-align: center;">
      <span class="num" style="font-size: 26px; font-weight: 800; color: oklch(22% 0.02 254);">$1,200</span>
      <span style="font-size: 13px; color: oklch(45% 0.02 254);"> recommended limit</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; border: 1.5px solid oklch(90% 0.012 254);">
        <div>
          <div style="font-size: 13.5px; font-weight: 700; color: oklch(22% 0.02 254);">Classic</div>
          <div class="num" style="font-size: 12px; color: oklch(45% 0.02 254);">$500 limit</div>
        </div>
        <div style="width: 20px; height: 20px; border-radius: 999px; border: 2px solid oklch(85% 0.012 254);"></div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; border: 2px solid oklch(52% 0.16 254); background: oklch(96% 0.02 254);">
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 13.5px; font-weight: 700; color: oklch(22% 0.02 254);">Gold</span>
            <span class="num" style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: oklch(100% 0 0); background: oklch(52% 0.16 254); padding: 2px 7px; border-radius: 999px;">Recommended</span>
          </div>
          <div class="num" style="font-size: 12px; color: oklch(45% 0.02 254);">$1,200 limit</div>
        </div>
        <div style="width: 20px; height: 20px; border-radius: 999px; background: oklch(52% 0.16 254); display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="oklch(100% 0 0)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; border: 1.5px solid oklch(90% 0.012 254); opacity: 0.55;">
        <div>
          <div style="font-size: 13.5px; font-weight: 700; color: oklch(22% 0.02 254);">Platinum</div>
          <div class="num" style="font-size: 12px; color: oklch(45% 0.02 254);">$2,500 limit &middot; exceeds Financial Power</div>
        </div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="oklch(60% 0.02 254)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 2px 2px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="oklch(58% 0.14 152)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        <span style="font-size: 12px; color: oklch(45% 0.02 254);">No annual fee in year one</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="oklch(58% 0.14 152)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        <span style="font-size: 12px; color: oklch(45% 0.02 254);">1.5% cashback on everyday spend</span>
      </div>
    </div>
  </div>

  <div style="padding: 12px 24px 22px; flex-shrink: 0;">
    <button type="button" class="btn" style="width: 100%; height: 52px; border-radius: 14px; background: oklch(52% 0.16 254); color: oklch(100% 0 0); font-size: 15px; font-weight: 700;">Apply Now</button>
  </div>

</div>
</x-dc>
</body>
</html>
